<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="rom2altsound">
<title><!--TITLE--></title>
<style>
:root {
  --bg: #fbfbfa; --fg: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0; --card: #ffffff;
  --accent: #2459c9; --accent-fg: #ffffff; --warn: #a3410b; --warn-bg: #fdeee4;
  --tag-bg: #eef0f3; --row-hi: #edf2fd; --focus: #2459c9; --head-bg: #f3f3f1;
  --edit: #6a3fb5; --edit-bg: #f1ebfb;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --fg: #e8e8ea; --muted: #9a9aa2; --line: #2e3034; --card: #1f2023;
    --accent: #7ea6ff; --accent-fg: #0f1115; --warn: #ffb27a; --warn-bg: #3a2416;
    --tag-bg: #2a2c31; --row-hi: #22293a; --focus: #7ea6ff; --head-bg: #1c1d20;
    --edit: #c9a8ff; --edit-bg: #2d2540;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: 92px; overflow-x: hidden;
}
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px; }
header { padding: 20px 0 8px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h1 small { font-weight: normal; color: var(--muted); font-size: 15px; }
.meta { color: var(--muted); font-size: 13px; margin: 2px 0; }
.borrowed { color: var(--warn); background: var(--warn-bg); font-size: 13px; margin: 6px 0; padding: 6px 10px; border-radius: 6px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.92em; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 0; font-size: 13px; }
.tools .lbl { color: var(--muted); }
#names-status { color: var(--muted); }
.bar {
  position: sticky; top: 0; z-index: 2; background: var(--bg);
  border-bottom: 1px solid var(--line); padding: 8px 0;
}
.bar .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type=search], input[type=text], select {
  font: inherit; color: var(--fg); background: var(--card);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-height: 34px;
}
input[type=search] { flex: 1 1 200px; min-width: 0; }
input#cmp { flex: 1 1 220px; min-width: 0; }
label.chk { display: inline-flex; gap: 4px; align-items: center; font-size: 14px; white-space: nowrap; }
#shown { color: var(--muted); font-size: 13px; margin-left: auto; }
button {
  font: inherit; font-size: 13px; cursor: pointer; color: var(--fg); background: var(--card);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; min-height: 32px;
}
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
button[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.pk { border-color: var(--accent); }
button.link { border: 0; background: none; color: var(--accent); padding: 0; min-height: 0; text-decoration: underline; }
/* The sounds: the table scrolls sideways in its own box, never the page. */
.tablewrap { overflow-x: auto; margin: 8px 0 12px; border: 1px solid var(--line); border-radius: 6px; }
table.sounds { margin: 0; min-width: 1100px; }
table.sounds th, table.sounds td { vertical-align: top; font-size: 13.5px; padding: 6px 8px; }
table.sounds thead th { background: var(--head-bg); white-space: nowrap; font-weight: 600; padding: 0; }
table.sounds thead th.static { padding: 6px 8px; }
th button.sort {
  border: 0; border-radius: 0; background: none; width: 100%; text-align: inherit; font-weight: 600;
  padding: 6px 8px; min-height: 34px; font-size: 13.5px;
}
th button.sort::after { content: "\2195"; color: var(--muted); margin-left: 4px; font-weight: normal; }
th[aria-sort=ascending] button.sort::after { content: "\25B2"; color: var(--accent); }
th[aria-sort=descending] button.sort::after { content: "\25BC"; color: var(--accent); }
th.n button.sort { text-align: right; }
tr.row:focus { outline: 2px solid var(--focus); outline-offset: -2px; }
tr.row.playing { background: var(--row-hi); }
td.btns { white-space: nowrap; }
td.btns button + button { margin-left: 4px; }
td.id { font-weight: 600; white-space: nowrap; }
td.name { min-width: 14em; max-width: 28em; overflow-wrap: anywhere; }
td.name .unnamed { color: var(--muted); font-style: italic; }
td.name .edited {
  font-size: 11.5px; color: var(--edit); background: var(--edit-bg); border-radius: 4px;
  padding: 0 4px; margin-left: 4px; white-space: nowrap;
}
td.name button.edit { min-height: 26px; padding: 0 6px; margin-left: 4px; color: var(--muted); }
td.name input { width: 100%; min-width: 12em; min-height: 30px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td .muted, td .sub { color: var(--muted); }
td .sub { font-size: 12px; }
td.loop { white-space: nowrap; font-variant-numeric: tabular-nums; }
td.tags { min-width: 8em; }
.tag { display: inline-block; background: var(--tag-bg); border-radius: 4px; padding: 0 5px; margin: 1px 2px 1px 0; color: var(--fg); font-size: 12.5px; }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--card);
  border-top: 1px solid var(--line); padding: 8px 0;
}
.player .wrap { display: flex; gap: 10px; align-items: center; }
#side {
  flex: none; font-weight: 600; font-size: 13px; border-radius: 4px; padding: 1px 7px;
  background: var(--tag-bg); color: var(--fg);
}
#side.b { background: var(--accent); color: var(--accent-fg); }
#side.miss { background: var(--warn-bg); color: var(--warn); }
#now { flex: 0 1 40%; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
audio { flex: 1 1 auto; min-width: 0; width: 100%; height: 40px; }
table { border-collapse: collapse; width: 100%; margin: 12px 0; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
a { color: var(--accent); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.tag.rep { background: var(--edit-bg); color: var(--edit); }
td.btns button.rp { color: var(--muted); }
td.btns button.rp.on { color: var(--edit); border-color: var(--edit); }
#rep-status { color: var(--muted); }
#rep-status.dirty { color: var(--warn); }
dialog.rep {
  border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg);
  padding: 18px 20px; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
}
dialog.rep::backdrop { background: rgba(0, 0, 0, 0.35); }
dialog.rep h2 { font-size: 18px; margin: 0 0 8px; overflow-wrap: anywhere; }
dialog.rep .line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
dialog.rep .line > .grow { flex: 1 1 auto; }
dialog.rep input[type=range] { flex: 1 1 180px; min-width: 0; }
dialog.rep output { font-variant-numeric: tabular-nums; min-width: 11em; }
dialog.rep audio { flex: 1 1 100%; }
dialog.rep p { margin: 6px 0; font-size: 13.5px; }
dialog.rep .note { color: var(--muted); }
dialog.rep .warn { color: var(--warn); background: var(--warn-bg); padding: 4px 8px; border-radius: 6px; }
dialog.rep button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
dialog.rep #rep-side { font-weight: 600; font-size: 13px; border-radius: 4px; padding: 1px 7px; background: var(--tag-bg); }
dialog.rep #rep-side.b { background: var(--accent); color: var(--accent-fg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 600px) {
  #now { display: none; }
  #shown { margin-left: 0; }
  .wrap { padding: 0 12px; }
}
</style>
</head>
<body>
<script type="application/json" id="data">/*DATA*/</script>
<header class="wrap" id="head"></header>
<div class="bar" id="bar" hidden>
  <div class="wrap">
    <input type="search" id="q" placeholder="Search id, name, flag... ( / )" aria-label="Search">
    <select id="type" aria-label="Type">
      <option value="">All types</option>
      <option value="music">Music</option>
      <option value="callout">Voice</option>
      <option value="sfx">Sound effects</option>
    </select>
    <label class="chk"><input type="checkbox" id="loops"> Loops only</label>
    <label class="chk"><input type="checkbox" id="sound" checked> With sound</label>
    <label class="chk" title="The sounds you replaced or changed the volume of"><input type="checkbox" id="changed"> Changed only</label>
    <input type="text" id="cmp" placeholder="Compare with folder: ../taf_l5-edit/ or C:\packs\taf_l5-edit" aria-label="Compare with folder (A/B)" title="A/B test: another folder holding files of the same names (a copy of this one with some sounds swapped); each row gets an A/B button, b flips" spellcheck="false" autocomplete="off">
    <span id="shown" aria-live="polite"></span>
  </div>
</div>
<main class="wrap">
  <div class="tablewrap" id="tw" hidden>
    <table class="sounds" id="table">
      <caption class="sr">Sounds; click a column title to sort</caption>
      <thead><tr id="cols"></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>
  <div id="index"></div>
</main>
<dialog class="rep" id="rep" aria-labelledby="rep-title">
  <h2 id="rep-title"></h2>
  <p id="rep-orig" class="note"></p>
  <div class="line">
    <button type="button" id="rep-pick">Choose a file...</button>
    <span id="rep-file" class="grow"></span>
    <input type="file" id="rep-input" hidden accept="audio/*,.wav,.ogg,.mp3,.flac" aria-label="Your sound file">
  </div>
  <p id="rep-loop" class="note" hidden>This sound loops in the game: your file plays again and again, from its start to its end. Listen to the join with the loop box ticked.</p>
  <div class="line">
    <span id="rep-side">A</span>
    <button type="button" id="rep-a" title="The ROM's sound, as extracted">▶ A: the ROM's</button>
    <button type="button" id="rep-b" title="What AltSound will play, at the volume below">▶ B: new</button>
    <button type="button" id="rep-ab" title="Switch between A and B at the same position">A/B</button>
    <label class="chk"><input type="checkbox" id="rep-looped"> Loop</label>
    <audio id="rep-audio" controls preload="none"></audio>
  </div>
  <div class="line">
    <label for="rep-gain">Volume</label>
    <input type="range" id="rep-gain" min="-40" max="0" step="0.5" value="0">
    <output id="rep-gainv" for="rep-gain"></output>
    <button type="button" id="rep-match" title="The volume that gives the new sound the loudness (LUFS) of the ROM's">Match the ROM's loudness</button>
  </div>
  <label class="chk"><input type="checkbox" id="rep-raise"> Raise the file to its maximum first (saved as a WAV copy)</label>
  <p id="rep-note"></p>
  <div class="line">
    <button type="button" id="rep-revert">Back to the ROM's sound</button>
    <span class="grow"></span>
    <button type="button" id="rep-cancel">Cancel</button>
    <button type="button" id="rep-ok" class="primary">Use it</button>
  </div>
</dialog>
<div class="player" id="player" hidden>
  <div class="wrap"><span id="side" hidden>A</span><span id="now">Nothing playing</span><audio id="audio" controls preload="none"></audio></div>
</div>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("data").textContent);
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function num(v, d) { return typeof v === "number" ? v.toFixed(d) : null; }
  function secs(v) {
    if (typeof v !== "number") return "";
    if (v < 60) return v.toFixed(v < 10 ? 2 : 1) + " s";
    var m = Math.floor(v / 60), s = v - m * 60;
    return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
  }
  function db(v) { return typeof v === "number" ? (v > 0 ? "+" : "") + v.toFixed(2) + " dB" : "?"; }
  function href(p) { return p.split("/").map(encodeURIComponent).join("/"); }
  // Browser storage, when there is any (a private window or a locked-down browser may have
  // none, or throw): the page works without it, only nothing is remembered.
  function load(key) { try { return localStorage.getItem(key) || ""; } catch (e) { return ""; } }
  function save(key, v) {
    try { if (v) localStorage.setItem(key, v); else localStorage.removeItem(key); } catch (e) { /* no storage */ }
  }

  if (data.roms) { return batchIndex(); }

  // Header: the ROM, its boards, and what volume the files are at.
  var head = $("head"), c = data.counts || {};
  var h1 = el("h1", null, data.rom || "");
  if (data.parent) h1.appendChild(el("small", null, " (parent " + data.parent + ")"));
  head.appendChild(h1);
  var bits = [];
  if (data.boards) bits.push(data.boards.join(", "));
  if (data.mode) bits.push(data.mode);
  if (c.written !== undefined) bits.push(c.written + " files");
  if (c.loops !== undefined) bits.push(c.loops + " loops");
  if (typeof data.lufs === "number") bits.push("all files " + data.lufs.toFixed(1) + " LUFS");
  head.appendChild(el("p", "meta", bits.join(" · ")));
  var v = data.volume || {}, vol = [];
  if (v.recorded) vol.push("Files at " + v.recorded);
  if (v.reference) vol.push("reference volume " + v.reference);
  if (v.factory) vol.push("factory volume " + v.factory);
  if (typeof v.offset_db === "number") vol.push("factory offset " + db(v.offset_db));
  if (vol.length) head.appendChild(el("p", "meta", vol.join("; ")));
  if (data.levels_note) head.appendChild(el("p", "meta", data.levels_note));
  if (data.borrowed) head.appendChild(el("p", "borrowed", data.borrowed));
  head.appendChild(el("p", "meta", "Click a column title to sort (again to reverse). Space or Enter plays the selected sound, arrows move, / searches, F2 or ✎ renames, ⇄ replaces a sound with your own file or changes its volume, b flips A/B (with a folder to compare). rom2altsound " + data.version));

  // Names typed on this page, by sound id ("" = no name), kept in the browser for this ROM;
  // "Export names" writes them to a names.csv for `rom2altsound names`.
  var NAMES = "rom2altsound.names." + (data.rom || ""), edits = {};
  try { edits = JSON.parse(load(NAMES) || "{}") || {}; } catch (e) { edits = {}; }
  if (typeof edits !== "object" || Array.isArray(edits)) edits = {};
  function saveEdits() { save(NAMES, Object.keys(edits).length ? JSON.stringify(edits) : ""); }
  function nameOf(s) { return Object.prototype.hasOwnProperty.call(edits, s.id) ? edits[s.id] : (s.name || ""); }
  function edited(s) { return Object.prototype.hasOwnProperty.call(edits, s.id); }
  function cleanName(n) { return String(n).replace(/[\u0000-\u001f\u007f-\u009f]/g, " ").replace(/\s+/g, " ").trim(); }

  // Replacement sounds (replacements.csv), by sound id: the file AltSound plays instead
  // of the ROM's ("" = the ROM's own) and its GAIN (0-100: AltSound can only lower a sound).
  // `blobs`: files chosen here that are not in the pack folder yet, by their FNAME.
  var REPDIR = data.replace_dir || "replace", REPFILE = data.replace_file || "replacements.csv";
  var EXTS = data.replace_exts || ["wav", "ogg", "mp3", "flac"];
  var repl = recordOf(data.replacements), blobs = {}, touched = {};
  // What the folder's replacements.csv says (as far as this page knows).
  var disk = recordOf(data.replacements);

  var sounds = data.sounds || [];
  sounds.forEach(function (s, i) {
    s.i = i;
    s.key = normId(s.id);
    s.base = s.files;
    refreshFiles(s);
    s.typ = typeOf(s);
    // An edit that says what the pack says is no edit (names applied with `rom2altsound names`).
    if (edited(s) && edits[s.id] === (s.name || "")) delete edits[s.id];
    hay(s);
  });
  saveEdits();
  function hay(s) {
    var e = entryOf(s);
    s.hay = [s.id, nameOf(s), edited(s) ? "edited" : "", e ? (e.fname ? "replaced " + e.source : "volume") : "",
      s.typ, s.board, s.twin_of ? "twin " + s.twin_of : "",
      s.loop ? "loop " + s.loop.method : ""].concat(s.flags || []).join(" ").toLowerCase();
  }
  function typeOf(s) {
    if (s.pack && s.pack.type) return s.pack.type;
    var n = (s.name || "").replace(/^\s+/, ""), l = n.toLowerCase();
    if (s.loop || l.indexOf("music:") === 0) return "music";
    if (n.charAt(0) === "\"" || l.indexOf("vox:") === 0 || l.indexOf("voice:") === 0) return "callout";
    return "sfx";
  }
  var multiBoard = data.boards && data.boards.length > 1;
  function isWarn(f) { return /^(clipped|not clean|ignores|loop unresolved|cut)/.test(f); }

  // The columns: what a click on the title sorts by (null: no value, always last) and which
  // way first (-1: the largest first).
  var COLS = [
    { title: "Play", cls: "static" },
    { key: "id", title: "ID", dir: 1, val: function (s) { return s.i; } },
    { key: "name", title: "Name", dir: 1, text: true, val: function (s) { return nameOf(s) || null; } },
    { key: "type", title: "Type", dir: 1, text: true, val: function (s) { return s.typ; } },
    { key: "duration", title: "Duration", n: true, dir: -1, val: function (s) { return s.duration; } },
    { key: "lufs", title: "LUFS", n: true, dir: -1, val: function (s) { return s.lufs; } },
    { key: "tp", title: "True peak", n: true, dir: -1, val: function (s) { return s.true_peak; } },
    { key: "loop", title: "Loop", dir: -1, val: function (s) { return s.loop ? s.loop.period_secs : null; } },
    { key: "pack", title: "Pack", dir: 1, val: function (s) { return s.pack && typeof s.pack.channel === "number" ? s.pack.channel : null; } },
    { key: "flags", title: "Flags", dir: -1, val: function (s) {
      var n = (s.flags || []).length + (s.twin_of ? 0.5 : 0);
      return n || null;
    } }
  ];
  var byKey = {};
  COLS.forEach(function (col) { if (col.key) byKey[col.key] = col; });
  var SORT = "rom2altsound.sort." + (data.rom || ""), sort = { key: "id", dir: 1 };
  try {
    var st = JSON.parse(load(SORT) || "null");
    if (st && byKey[st.key] && (st.dir === 1 || st.dir === -1)) sort = st;
  } catch (e) { /* the default order */ }

  var heads = {};
  COLS.forEach(function (col) {
    var th = el("th", (col.n ? "n " : "") + (col.cls || ""));
    th.scope = "col";
    if (col.key) {
      var b = el("button", "sort", col.title);
      b.type = "button";
      b.title = "Sort by " + col.title.toLowerCase() + " (click again to reverse)";
      b.addEventListener("click", function () {
        sort = sort.key === col.key ? { key: col.key, dir: -sort.dir } : { key: col.key, dir: col.dir };
        save(SORT, JSON.stringify(sort));
        apply();
      });
      th.appendChild(b);
      heads[col.key] = th;
    } else {
      th.textContent = col.title;
    }
    $("cols").appendChild(th);
  });
  function showSort() {
    Object.keys(heads).forEach(function (k) {
      if (k === sort.key) heads[k].setAttribute("aria-sort", sort.dir > 0 ? "ascending" : "descending");
      else heads[k].removeAttribute("aria-sort");
    });
  }
  function compare(a, b) {
    var col = byKey[sort.key], x = col.val(a), y = col.val(b);
    var nx = x === null || x === undefined || (typeof x === "number" && isNaN(x));
    var ny = y === null || y === undefined || (typeof y === "number" && isNaN(y));
    if (nx || ny) return nx && ny ? a.i - b.i : nx ? 1 : -1;
    var d = col.text ? String(x).localeCompare(String(y), undefined, { sensitivity: "base", numeric: true }) : x - y;
    return d * sort.dir || a.i - b.i;
  }

  function td(cls, text) { return el("td", cls, text); }
  function tag(parent, text, warn) {
    var t = el("span", "tag" + (warn ? " warn" : ""), text);
    parent.appendChild(t);
    return t;
  }
  function row(s) {
    var tr = el("tr", "row");
    tr.tabIndex = -1;
    tr.dataset.i = s.i;
    tr.id = "s-" + s.i;
    s.btns = td("btns");
    renderBtns(s);
    tr.appendChild(s.btns);
    tr.appendChild(td("id mono", s.id));
    s.nameCell = td("name");
    s.nameCell.addEventListener("dblclick", function (e) {
      if (e.target.tagName !== "INPUT") editName(s);
    });
    tr.appendChild(s.nameCell);
    renderName(s);

    var ty = td("tags");
    tag(ty, s.typ === "callout" ? "voice" : s.typ);
    if (multiBoard && s.board) tag(ty, s.board);
    tr.appendChild(ty);
    tr.appendChild(td("n", secs(s.duration)));
    tr.appendChild(td("n", num(s.lufs, 1)));
    var tp = td("n", num(s.true_peak, 1));
    if (typeof s.peak === "number") tp.title = "peak " + s.peak.toFixed(2) + " dBFS";
    tr.appendChild(tp);

    var lc = td("loop");
    if (s.loop) {
      lc.appendChild(document.createTextNode(secs(s.loop.period_secs)));
      if (s.loop.intro_secs >= 0.05) lc.appendChild(el("span", "muted", " from " + secs(s.loop.intro_secs)));
      if (s.loop.method) lc.appendChild(el("div", "sub", s.loop.method));
      if (typeof s.loop.confidence === "number") lc.title = "confidence " + s.loop.confidence;
    }
    tr.appendChild(lc);

    var pc = td("tags"), p = s.pack;
    if (p) {
      if (p.channel === 0) tag(pc, "ch 0 (music)");

  // The play buttons of a row (one per file, the one AltSound plays outlined), A/B, and ⇄.

  // The name cell: the name (or "no name"), a mark when it is a name typed here, and the

  // Names: export to a names.csv, import one back, share it (Send names), forget the edits.

  tool("Export names", "Save names.csv: every sound's name, yours included, for rom2altsound names <folder> names.csv", exportNames);
  var file = el("input");

  tools.appendChild(file);

  var send = tool("Send names", data.names_upload

  function csvField(v) {
    v = String(v);

  }
  // 0x392 -> 0x0392, like altsound.csv; other ids as they are.

  // The names.csv of this page: what Export names saves and Send names sends, byte for byte.

    out.push("# rom2altsound: " + data.version, "ID,NAME");
    var n = 0;
    sounds.forEach(function (s) {
      var name = nameOf(s);
      // A name cleared here is written empty, so that it clears the pack's too.
      if (name || edited(s)) { out.push(csvField(normId(s.id)) + "," + csvField(name)); n++; }
    });

  }

    a.hidden = true;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    showEdits("names.csv: " + n + " name" + (n === 1 ? "" : "s") + ".");
  }

  // Send names: the names.csv, and nothing else, to the shared drop of names (write-only:
  // nobody can read a file back from it), as <rom>/<sound_rom_id>/<UTC time>.csv; the
  // folder URL comes with the page data. Only after the user says yes.
  var sending = false;
  function sendNames() {
    var csv = namesCsv(), n = Object.keys(edits).length;
    if (sending || !n || !data.names_upload) return;
    if (!confirm("Send your names to the shared naming of sounds?\n\n" +
        "This sends the names.csv that Export names saves (" + csv.n + " name" + (csv.n === 1 ? "" : "s") +
        " for " + data.rom + ", sound ROM " + data.sound_rom_id + ") to rom2altsound's public collection of names.\n\n" +
        "The names are shared publicly under CC0 (public domain), to build one naming of sounds for everyone: " +
        "they come back in later catalogs and in sounds.dat.\n\n" +
        "Nothing else is sent: no personal data, only this list of sound ids and names.")) {

    };

      fetch(data.names_upload + t + ".csv", {
        method: "PUT", body: csv.text, headers: { "Content-Type": "text/csv" },
        credentials: "omit", referrerPolicy: "no-referrer", cache: "no-store"

        function (e) { done(false, "no connection to the server"); });
    } catch (e) { done(false, e.message); }
  }

  // RFC 4180 records; a record that starts with # is a comment up to the end of its line.
  function parseCsv(text) {
    var recs = [], i = 0, L = text.length;
    text = text.replace(/^\uFEFF/, "");
    L = text.length;
    while (i < L) {

        var e = text.indexOf("\n", i);
        if (e < 0) e = L;
        recs.push({ comment: text.slice(i, e).replace(/\r$/, "") });
        i = e + 1;
        continue;
      }
      var rec = [], f = "", q = false;
      for (;;) {
        if (i >= L) { if (q) throw new Error("a quoted field is not closed"); rec.push(f); break; }
        var ch = text.charAt(i++);
        if (q) {
          if (ch === "\"") { if (text.charAt(i) === "\"") { f += "\""; i++; } else q = false; }
          else f += ch;
        } else if (ch === "\"" && f === "") q = true;
        else if (ch === ",") { rec.push(f); f = ""; }
        else if (ch === "\r" && text.charAt(i) === "\n") { /* the \n ends it */ }
        else if (ch === "\n") { rec.push(f); break; }
        else f += ch;

        if (m) meta[m[1].toLowerCase()] = m[2].trim();
        return;
      }
      var f = r.fields;
      if (f.every(function (x) { return !x.trim(); })) return;
      if (!cols) {
        var up = f.map(function (x) { return x.trim().toUpperCase(); });
        if (up.indexOf("ID") < 0 || up.indexOf("NAME") < 0) throw new Error("no ID,NAME header");
        cols = { id: up.indexOf("ID"), name: up.indexOf("NAME") };
        return;
      }
      got.push({ id: normId(f[cols.id] || ""), name: cleanName(f[cols.name] || "") });

      (unknown.length ? " (" + unknown.length + " id" + (unknown.length > 1 ? "s" : "") + " not in this pack: " +
        unknown.slice(0, 8).join(" ") + (unknown.length > 8 ? " ..." : "") + ")" : "") + ".";
  }
  file.addEventListener("change", function () {

    rd.onload = function () {
      var msg;
      try { msg = importNames(String(rd.result)); } catch (e) { msg = f.name + ": " + e.message + "."; }

  });
  function clearEdits() {
    var n = Object.keys(edits).length;

  // One shared player. A loop body plays looped; the button of what plays pauses it.
  var audio = $("audio"), playing = null;
  function play(s, k) {
    var f = s.files[k], src = srcOf(f);
    if (playing && playing.s === s && playing.k === k) {
      if (audio.paused) audio.play(); else audio.pause();
      return;
    }
    mark(false);
    playing = { s: s, k: k };
    audio.loop = f.label === "loop" || (f.label === "new" && s.pack && s.pack.kind === "body_loop");
    audio.src = src;
    audio.volume = volOf(s, f);
    audio.play().catch(function () {});
    nowLabel();
    mark(true);
  }
  function nowLabel() {
    if (!playing) return;
    var s = playing.s, f = s.files[playing.k], b = side === "B", n = nameOf(s);
    $("now").textContent = s.id + (n ? " " + n : "") + " (" + f.label + (audio.loop ? ", looped" : "") +
      (b ? ", from " + cmp : "") + ")";
    $("now").title = (b ? cmp : "") + f.path;
  }
  function mark(on) {
    if (!playing) return;
    var r = rows[playing.s.i];
    r.classList.toggle("playing", on);
    var b = r.querySelectorAll(".btns button")[playing.k];
    if (b) b.setAttribute("aria-pressed", on && !audio.paused ? "true" : "false");
    if (playing.s.ab) playing.s.ab.setAttribute("aria-pressed", on && side === "B" ? "true" : "false");
  }

  // A/B: the same file names in another folder (goodtwist's idea: copy the pack folder,
  // swap sounds in the copy, compare). Plain <audio> src switching, no fetch (file://).
  var KEY = "rom2altsound.compare." + (data.rom || ""), cmp = "", side = "A", missingB = {};
  // The compare folder may be relative to this page (../copy/) or absolute: a Windows drive
  // path (C:/...), a UNC share (//server/share/...) or a Unix path (/...), which need a
  // file: URL (an encoded "C:" would read as a relative name).
  function srcOf(f) {
    if (side !== "B") return f.blob ? blobUrl(f.blob) : href(f.path);
    var p = cmp + f.path, d = /^([A-Za-z]):\//.exec(p);
    if (d) return "file:///" + d[1] + ":/" + href(p.slice(3));
    if (p.charAt(0) === "/") return "file:" + (p.charAt(1) === "/" ? "" : "//") + href(p);

  }
  function setCompare(v, keep) {
    v = String(v || "").trim().replace(/\\/g, "/");

    if (v !== cmp) missingB = {};
    cmp = v;
    if (keep) save(KEY, cmp);
    sounds.forEach(function (s) { if (s.ab) s.ab.hidden = !cmp; });
    if (!cmp && side === "B") flip(true);

        if (Math.abs(v) > best) best = Math.abs(v);

  }
  function measure(buf) {
    var fs = buf.sampleRate, ch = buf.numberOfChannels, n = buf.length, step = Math.ceil(fs / 10);
    var steps = Math.floor(n / step), sq = new Float64Array(Math.max(steps, 1)), all = 0, tp = 0;
    for (var c = 0; c < ch; c++) {

        var e = y[i] * y[i] * w;

      var mean = abs.reduce(function (a, b) { return a + b; }, 0) / abs.length;
      var rel = abs.filter(function (b) { return -0.691 + 10 * Math.log10(b) > -0.691 + 10 * Math.log10(mean) - 10; });
      var m2 = rel.reduce(function (a, b) { return a + b; }, 0) / rel.length;
      level = -0.691 + 10 * Math.log10(m2);
    }

  }
  // 16-bit PCM WAV of the buffer times `gain`.
  function wavOf(buf, gain) {
    var ch = buf.numberOfChannels, n = buf.length, fs = buf.sampleRate, out = new DataView(new ArrayBuffer(44 + n * ch * 2));
    var str = function (o, t) { for (var i = 0; i < t.length; i++) out.setUint8(o + i, t.charCodeAt(i)); };
    str(0, "RIFF"); out.setUint32(4, 36 + n * ch * 2, true); str(8, "WAVE"); str(12, "fmt ");
    out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
    out.setUint32(24, fs, true); out.setUint32(28, fs * ch * 2, true); out.setUint16(32, ch * 2, true);
    out.setUint16(34, 16, true); str(36, "data"); out.setUint32(40, n * ch * 2, true);
    var chans = [];
    for (var c = 0; c < ch; c++) chans.push(buf.getChannelData(c));
    var o = 44;
    for (var i = 0; i < n; i++) {
      for (c = 0; c < ch; c++) {
        var v = Math.round(chans[c][i] * gain * 32767);
        out.setInt16(o, v > 32767 ? 32767 : v < -32768 ? -32768 : v, true);
        o += 2;
      }
    }
    return new Blob([out.buffer], { type: "audio/wav" });
  }
  function decode(file) {
    return file.arrayBuffer().then(function (ab) {
      var head = new Uint8Array(ab.slice(0, 64)), txt = String.fromCharCode.apply(null, head);
      // Ogg Opus: browsers play it, AltSound (stb_vorbis) does not.
      var opus = txt.indexOf("OggS") === 0 && txt.indexOf("OpusHead") >= 0;
      var ctx = new OfflineAudioContext(1, 1, data.sample_rate || 44100);
      return ctx.decodeAudioData(ab).then(function (buf) { return { buf: buf, opus: opus }; });
    });
  }

  // ---- The dialog -----------------------------------------------------------------
  var RAW = document.getElementById("data").textContent;
  var dlg = $("rep"), ra = $("rep-audio"), cur = null;
  var HEAD = -1; // a raised file peaks at -1 dBTP
  function target(s) { return typeof s.level_lufs === "number" ? s.level_lufs : typeof s.lufs === "number" ? s.lufs : null; }
  function gainOfDb(d) { return Math.max(0, Math.min(100, Math.round(100 * Math.pow(10, d / 20)))); }
  function openRep(s) {
    if (!s.rows || !s.factory_file) return;
    if (playing) audio.pause();
    var e = entryOf(s), n = nameOf(s);
    cur = { s: s, e: e, file: null, dec: null, m: null, raise: false, db: e ? (e.gain > 0 ? 20 * Math.log10(e.gain / 100) : -40) : 0, side: "A", out: null };
    $("rep-title").textContent = (e && e.fname ? "Your sound for " : "Replace ") + s.id + (n ? " " + n : "");
    var bits = ["The ROM's sound: " + secs(s.duration)];
    if (typeof target(s) === "number") bits.push(target(s).toFixed(1) + " LUFS");
    if (typeof s.true_peak === "number") bits.push("peak " + s.true_peak.toFixed(1) + " dBTP");
    $("rep-orig").textContent = bits.join(", ") + (s.rows.length > 1 ? " · rows " + s.rows.join(" ") : "") + ".";
    var looped = !!(s.pack && s.pack.kind === "body_loop");
    $("rep-loop").hidden = !looped;
    $("rep-looped").checked = looped;
    $("rep-input").value = "";
    $("rep-revert").hidden = !e;
    showCur();
    ra.removeAttribute("src");
    sideTo("A", false);
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
    $("rep-pick").focus();
  }
  function closeRep() {
    ra.pause();
    if (cur && cur.outUrl) URL.revokeObjectURL(cur.outUrl);
    cur = null;
    if (dlg.open) dlg.close();
  }
  // The file AltSound would play (with its FNAME), or null for the ROM's file.
  function output() {
    var c = cur;
    if (!c.file) return null;
    var name = cleanFile(c.file.name), dot = name.lastIndexOf("."), ext = dot > 0 ? name.slice(dot + 1).toLowerCase() : "";
    var stem = dot > 0 ? name.slice(0, dot) : name;
    var asWav = c.raise || c.dec.opus || EXTS.indexOf(ext) < 0;
    var f = REPDIR + "/" + c.s.key + "-" + (asWav ? stem + ".wav" : name);
    // Never the name of the file it replaces: the folder still has that one.
    var taken = function (x) { return (c.e && c.e.fname === x) || blobs[x]; };
    for (var i = 2; taken(f); i++) f = REPDIR + "/" + c.s.key + "-" + stem + "-" + i + "." + (asWav ? "wav" : ext);
    if (!c.out || c.out.raise !== c.raise || c.out.fname !== f) {
      var blob = asWav ? wavOf(c.dec.buf, c.raise ? Math.pow(10, (HEAD - c.m.tp) / 20) : 1) : c.file;
      if (c.outUrl) URL.revokeObjectURL(c.outUrl);
      c.out = { raise: c.raise, fname: f, blob: blob, wav: asWav };
      c.outUrl = URL.createObjectURL(blob);
    }
    return c.out;
  }
  function headroom() { var m = cur.m; return m && m.tp !== null ? HEAD - m.tp : 0; }
  // The level of what AltSound plays: the file, raised or not, at the volume.
  function playedLevel() {
    var m = cur.m;
    if (!m || m.level === null) return null;
    return m.level + (cur.raise ? headroom() : 0) + cur.db;
  }
  function match() {
    var c = cur, T = target(c.s);
    if (!c.m || c.m.level === null || T === null) return;
    var d = T - c.m.level, h = headroom();
    // Louder than the ROM's: lowered by GAIN. Quieter: raised to its maximum (a WAV copy),
    // then lowered by GAIN as far as needed.
    c.raise = d > 0 && h > 0.1;
    c.db = Math.max(-40, Math.min(0, d - (c.raise ? h : 0)));
  }
  function showCur() {
    var c = cur, s = c.s, T = target(s), m = c.m;
    var fileTxt = c.file
      ? c.file.name + (m ? ": " + secs(m.secs) + (m.level !== null ? ", " + m.level.toFixed(1) + " LUFS" : ", silent") +
        (m.tp !== null ? ", peak " + m.tp.toFixed(1) + " dBTP" : "") : ": reading...")
      : c.e && c.e.fname ? "Now: " + (c.e.source || c.e.fname) + " (" + c.e.fname + ")" : "No file: the ROM's sound, at the volume below.";
    $("rep-file").textContent = fileTxt;
    var g = gainOfDb(c.db);
    $("rep-gain").value = String(Math.max(-40, c.db));
    $("rep-gainv").value = "GAIN " + g + " (" + gainDb(g) + ")";
    $("rep-gainv").textContent = $("rep-gainv").value;
    $("rep-raise").checked = c.raise;
    $("rep-raise").disabled = !m || headroom() <= 0.1;
    $("rep-match").disabled = !m || m.level === null || T === null;
    var note = $("rep-note"), lv = playedLevel(), msgs = [], warn = false;
    if (c.file && !m) msgs.push("Measuring your file...");
    if (m) {
      var out = output();
      msgs.push("AltSound will play " + out.fname + (out.wav ? " (a WAV copy" + (c.raise ? ", raised " + headroom().toFixed(1) + " dB to peak at " + HEAD + " dBTP" : "") + ")" : " (your file as it is)") + " at GAIN " + g + ".");
      if (c.dec.opus) msgs.push("Ogg Opus does not play in AltSound: saved as WAV.");
      if (lv !== null && T !== null) {
        var diff = lv - T;
        if (Math.abs(diff) < 0.25) msgs.push("Same loudness as the ROM's sound (" + T.toFixed(1) + " LUFS).");
        else {
          msgs.push((diff > 0 ? "Louder" : "Quieter") + " than the ROM's sound by " + Math.abs(diff).toFixed(1) + " dB (" + lv.toFixed(1) + " against " + T.toFixed(1) + " LUFS).");

      }

  }
  function srcB() {
    var c = cur, o = c.m ? output() : null;
    if (o) return c.outUrl;
    if (c.e && c.e.fname) return blobs[c.e.fname] ? blobUrl(blobs[c.e.fname]) : href(c.e.fname);
    return href(c.s.factory_file);
  }
  function sideTo(side, keep) {
    var c = cur, t = ra.currentTime || 0, was = keep && !ra.paused;

    $("rep-side").textContent = side;
    $("rep-side").className = side === "B" ? "b" : "";

    $("rep-b").setAttribute("aria-pressed", side === "B" ? "true" : "false");

    if (was) ra.play().catch(function () {});
  }
  $("rep-a").addEventListener("click", function () { sideTo("A", false); ra.currentTime = 0; ra.play().catch(function () {}); });
  $("rep-b").addEventListener("click", function () { sideTo("B", false); ra.currentTime = 0; ra.play().catch(function () {}); });
  $("rep-ab").addEventListener("click", function () {
    var was = !ra.paused;
    sideTo(cur.side === "A" ? "B" : "A", true);
    if (!was) ra.play().catch(function () {});
  });
  $("rep-looped").addEventListener("change", function () { ra.loop = $("rep-looped").checked; });
  $("rep-pick").addEventListener("click", function () { $("rep-input").click(); });
  $("rep-input").addEventListener("change", function () {
    var f = $("rep-input").files && $("rep-input").files[0], c = cur;
    if (!f || !c) return;
    c.file = f; c.dec = null; c.m = null; c.out = null;
    showCur();
    decode(f).then(function (d) {
      if (cur !== c || c.file !== f) return;
      c.dec = d;
      c.m = measure(d.buf);
      c.db = 0;
      c.raise = false;
      match();
      showCur();
      sideTo("B", false);
    }, function (e) {
      if (cur !== c) return;
      c.file = null;
      showCur();

      $("rep-note").className = "warn";
    });
  });
  $("rep-gain").addEventListener("input", function () { cur.db = parseFloat($("rep-gain").value); showCur(); });
  $("rep-match").addEventListener("click", function () { match(); showCur(); if (cur.side === "B") sideTo("B", true); });
  $("rep-raise").addEventListener("change", function () {
    // The same loudness as before, from the other file.
    var lv = playedLevel();
    cur.raise = $("rep-raise").checked;
    if (lv !== null) cur.db = Math.max(-40, Math.min(0, lv - cur.m.level - (cur.raise ? headroom() : 0)));
    showCur();
    if (cur.side === "B") sideTo("B", true);
  });
  $("rep-cancel").addEventListener("click", closeRep);
  dlg.addEventListener("cancel", function () { ra.pause(); cur = null; });
  dlg.addEventListener("close", function () { ra.pause(); });
  $("rep-revert").addEventListener("click", function () {
    var s = cur.s;
    closeRep();
    setEntry(s, null, null);
  });
  $("rep-ok").addEventListener("click", function () {
    var c = cur, s = c.s, g = gainOfDb(c.db), o = c.m ? output() : null;
    closeRep();
    if (o) setEntry(s, { fname: o.fname, gain: g, source: c.file.name }, o.blob);
    else if (c.e && c.e.fname) setEntry(s, { fname: c.e.fname, gain: g, source: c.e.source }, null);
    else if (g !== 100) setEntry(s, { fname: "", gain: g, source: "" }, null);
    else if (c.e) setEntry(s, null, null);
  });

  // Changes made here earlier and not in the folder yet (browser storage), and the folder
  // picked last time (Chrome, Edge).
  idbGet(PENDING).then(function (p) {
    if (!p || !p.record) return;
    var here = recordText(disk);
    // Applied since (the zip, or the folder written): the page now says what they said.
    if (here !== p.base && recordText(p.record) === here) { idbDel(PENDING); return; }
    repl = p.record;
    blobs = p.blobs || {};
    touched = p.touched || {};
    sounds.forEach(function (s) { refreshFiles(s); renderBtns(s); hay(s); renderRep(s); });
    apply();
    showRep("Restored your changes from this browser.");
  });
  if (canPick) idbGet(DIRKEY).then(function (h) { if (h && h.requestPermission) { folderSaved = h; showRep(); } });
  showRep();

  showEdits();
  apply();

  // The batch's root page: one line per ROM folder.
  function batchIndex() {
    var head = $("head");
    head.appendChild(el("h1", null, "rom2altsound packs"));
    head.appendChild(el("p", "meta", data.roms.length + " ROMs · rom2altsound " + data.version));
    var t = el("table"), tr = el("tr");
    ["ROM", "Boards", "Files", "Loops", "LUFS", "Factory offset"].forEach(function (h, i) {
      tr.appendChild(el("th", i > 1 ? "n" : null, h));
    });
    t.appendChild(tr);
    data.roms.forEach(function (r) {
      var tr = el("tr"), td = el("td"), a = el("a", "mono", r.rom || r.dir);
      a.href = href(r.page);
      td.appendChild(a);
      tr.appendChild(td);
      tr.appendChild(el("td", null, (r.boards || []).join(", ")));
      tr.appendChild(el("td", "n", r.written));
      tr.appendChild(el("td", "n", r.loops));
      tr.appendChild(el("td", "n", num(r.lufs, 1)));
      tr.appendChild(el("td", "n", typeof r.factory_offset_db === "number" ? db(r.factory_offset_db) : ""));
      t.appendChild(tr);
    });
    $("index").appendChild(t);
  }
})();
