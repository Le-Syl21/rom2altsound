html { -webkit-text-size-adjust: 100%; }

}

audio { flex: 1 1 auto; min-width: 0; width: 100%; height: 40px; }
table { border-collapse: collapse; width: 100%; margin: 12px 0; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
a { color: var(--accent); }

<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("data").textContent);
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function num(v, d) { return typeof v === "number" ? v.toFixed(d) : null; }
  function secs(v) {
    if (typeof v !== "number") return "";
    if (v < 60) return v.toFixed(v < 10 ? 2 : 1) + " s";
    var m = Math.floor(v / 60), s = v - m * 60;
    return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
  }
  function db(v) { return typeof v === "number" ? (v > 0 ? "+" : "") + v.toFixed(2) + " dB" : "?"; }
  function href(p) { return p.split("/").map(encodeURIComponent).join("/"); }
  // Browser storage, when there is any (a private window or a locked-down browser may have
  // none, or throw): the page works without it, only nothing is remembered.
  function load(key) { try { return localStorage.getItem(key) || ""; } catch (e) { return ""; } }
  function save(key, v) {
    try { if (v) localStorage.setItem(key, v); else localStorage.removeItem(key); } catch (e) { /* no storage */ }
  }

  if (data.roms) { return batchIndex(); }

  // Header: the ROM, its boards, and what volume the files are at.
  var head = $("head"), c = data.counts || {};
  var h1 = el("h1", null, data.rom || "");
  if (data.parent) h1.appendChild(el("small", null, " (parent " + data.parent + ")"));
  head.appendChild(h1);
  var bits = [];
  if (data.boards) bits.push(data.boards.join(", "));
  if (data.mode) bits.push(data.mode);
  if (c.written !== undefined) bits.push(c.written + " files");
  if (c.loops !== undefined) bits.push(c.loops + " loops");
  if (typeof data.lufs === "number") bits.push("all files " + data.lufs.toFixed(1) + " LUFS");
  head.appendChild(el("p", "meta", bits.join(" · ")));
  var v = data.volume || {}, vol = [];
  if (v.recorded) vol.push("Files at " + v.recorded);

  if (typeof v.offset_db === "number") vol.push("factory offset " + db(v.offset_db));
  if (vol.length) head.appendChild(el("p", "meta", vol.join("; ")));
  if (data.levels_note) head.appendChild(el("p", "meta", data.levels_note));
  head.appendChild(el("p", "meta", "Click a column title to sort (again to reverse). Space or Enter plays the selected sound, arrows move, / searches, F2 or ✎ renames, b flips A/B (with a folder to compare). rom2altsound " + data.version));

  var sounds = data.sounds || [];
  sounds.forEach(function (s, i) {

  function isWarn(f) { return /^(clipped|not clean|ignores|loop unresolved|cut)/.test(f); }

  // way first (-1: the largest first).

    { key: "id", title: "ID", dir: 1, val: function (s) { return s.i; } },
    { key: "name", title: "Name", dir: 1, text: true, val: function (s) { return nameOf(s) || null; } },
    { key: "type", title: "Type", dir: 1, text: true, val: function (s) { return s.typ; } },
    { key: "duration", title: "Duration", n: true, dir: -1, val: function (s) { return s.duration; } },
    { key: "lufs", title: "LUFS", n: true, dir: -1, val: function (s) { return s.lufs; } },
    { key: "tp", title: "True peak", n: true, dir: -1, val: function (s) { return s.true_peak; } },
    { key: "loop", title: "Loop", dir: -1, val: function (s) { return s.loop ? s.loop.period_secs : null; } },
    { key: "pack", title: "Pack", dir: 1, val: function (s) { return s.pack && typeof s.pack.channel === "number" ? s.pack.channel : null; } },
    { key: "flags", title: "Flags", dir: -1, val: function (s) {
      var n = (s.flags || []).length + (s.twin_of ? 0.5 : 0);
      return n || null;
    } }
  ];
  var byKey = {};
  COLS.forEach(function (col) { if (col.key) byKey[col.key] = col; });
  var SORT = "rom2altsound.sort." + (data.rom || ""), sort = { key: "id", dir: 1 };
  try {
    var st = JSON.parse(load(SORT) || "null");
    if (st && byKey[st.key] && (st.dir === 1 || st.dir === -1)) sort = st;
  } catch (e) { /* the default order */ }

  var heads = {};
  COLS.forEach(function (col) {
    var th = el("th", (col.n ? "n " : "") + (col.cls || ""));
    th.scope = "col";
    if (col.key) {
      var b = el("button", "sort", col.title);
      b.type = "button";
      b.title = "Sort by " + col.title.toLowerCase() + " (click again to reverse)";

  }

    tr.dataset.i = s.i;

  // The name cell: the name (or "no name"), a mark when it is a name typed here, and the

      apply();
      setCurrent(rows[s.i], true);

  }
  function setName(s, n) {
    n = cleanName(n);
    if (n === (s.name || "")) delete edits[s.id];
    else edits[s.id] = n;
    saveEdits();
    hay(s);
    showEdits();
  }

  // Rows are built once; filters only show or hide them.
  var rows = null;
  var list = $("list");
  rows = sounds.map(row);
  rows.forEach(function (r) { list.appendChild(r); });
  $("bar").hidden = false;
  $("tw").hidden = false;
  $("player").hidden = false;

  var visible = [];
  function apply() {
    var q = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var typ = $("type").value, loops = $("loops").checked, snd = $("sound").checked;
    var order = sounds.slice().sort(compare);
    visible = [];
    order.forEach(function (s) {
      var ok = (!typ || s.typ === typ) && (!loops || s.loop) && (!snd || s.files.length > 0) &&
        q.every(function (w) { return s.hay.indexOf(w) >= 0; });
      var r = rows[s.i];
      r.hidden = !ok;
      list.appendChild(r);
      if (ok) visible.push(r);
    });
    showSort();
    $("shown").textContent = visible.length + " of " + sounds.length + " shown";
    var cur = list.querySelector("tr.row[tabindex='0']");
    if (!cur || cur.hidden) setCurrent(visible[0], false);
    var none = $("index");
    none.className = visible.length ? "" : "empty";
    none.textContent = visible.length ? "" : "No sound matches.";
  }
  ["q", "type", "loops", "sound"].forEach(function (id) {
    $(id).addEventListener(id === "q" ? "input" : "change", apply);
  });

  // One row in the tab order at a time (roving tabindex); its buttons join it.
  function setCurrent(r, focus) {
    rows.forEach(function (x) {
      var on = x === r;
      x.tabIndex = on ? 0 : -1;
      Array.prototype.forEach.call(x.querySelectorAll("button"), function (b) { b.tabIndex = on ? 0 : -1; });
    });
    if (r && focus) { r.focus(); }
  }
  list.addEventListener("focusin", function (e) {
    var r = e.target.closest("tr.row");
    if (r && r.tabIndex !== 0) setCurrent(r, false);
  });
  list.addEventListener("keydown", function (e) {
    var r = e.target.closest("tr.row");
    if (!r) return;
    var at = visible.indexOf(r), to = -1;
    if (e.key === "ArrowDown") to = at + 1;
    else if (e.key === "ArrowUp") to = at - 1;
    else if (e.key === "Home") to = 0;
    else if (e.key === "End") to = visible.length - 1;
    else if (e.key === "F2") {
      e.preventDefault();
      editName(sounds[+r.dataset.i]);
      return;
    } else if ((e.key === " " || e.key === "Enter") && e.target === r) {
      e.preventDefault();
      var s = sounds[+r.dataset.i];
      if (s.files.length) play(s, 0);
      return;
    } else return;
    e.preventDefault();
    if (to >= 0 && to < visible.length) {
      setCurrent(visible[to], true);
      visible[to].scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  });
  function typing() { return /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName); }
  document.addEventListener("keydown", function (e) {
    var q = $("q");
    if (e.key === "/" && document.activeElement !== q && !typing()) {
      e.preventDefault();
      q.focus();
    } else if (e.key === "Escape" && document.activeElement === q) {
      setCurrent(visible[0], true);
    } else if (e.key === "ArrowDown" && document.activeElement === q && visible.length) {
      e.preventDefault();
      setCurrent(visible[0], true);
    } else if ((e.key === "b" || e.key === "B") && cmp && !e.ctrlKey && !e.metaKey && !e.altKey && !typing()) {
      e.preventDefault();
      if (playing) { flip(); return; }
      var r = list.querySelector("tr.row[tabindex='0']");
      if (r && sounds[+r.dataset.i].files.length) abClick(sounds[+r.dataset.i]);
    }
  });

  function goTo(id) {
    var s = sounds.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    var r = rows[s.i];
    if (r.hidden) { $("q").value = ""; $("type").value = ""; $("loops").checked = false; $("sound").checked = false; apply(); }
    setCurrent(r, true);
    r.scrollIntoView({ block: "center" });
  }

  // Names: export to a names.csv, import one back, forget the edits.
  var tools = el("div", "tools");
  tools.appendChild(el("span", "lbl", "Names:"));
  function tool(text, title, fn) {
    var b = el("button", null, text);
    b.type = "button";
    b.title = title;
    b.addEventListener("click", fn);
    tools.appendChild(b);
    return b;
  }
  tool("Export names", "Save names.csv: every sound's name, yours included, for rom2altsound names <folder> names.csv", exportNames);
  var file = el("input");
  file.type = "file";
  file.accept = ".csv,text/csv";
  file.hidden = true;
  file.setAttribute("aria-label", "names.csv to import");
  tools.appendChild(file);
  tool("Import names", "Load a names.csv (from Export names) into this page", function () { file.click(); });
  var clear = tool("Clear my edits", "Forget the names typed on this page (the pack's names come back)", clearEdits);
  var status = el("span", null, "");
  status.id = "names-status";
  status.setAttribute("aria-live", "polite");
  tools.appendChild(status);
  head.appendChild(tools);
  function showEdits(msg) {
    var n = Object.keys(edits).length;
    clear.disabled = !n;
    status.textContent = (msg ? msg + " " : "") + (n ? n + " name" + (n > 1 ? "s" : "") + " edited here." : "");
  }

  function csvField(v) {
    v = String(v);
    return /[",\r\n]|^\s|\s$/.test(v) ? "\"" + v.replace(/"/g, "\"\"") + "\"" : v;
  }
  // 0x392 -> 0x0392, like altsound.csv; other ids as they are.
  function normId(id) {
    id = String(id).trim();
    var m = /^0x([0-9a-f]{1,8})$/i.exec(id);
    if (!m) return id;
    var h = parseInt(m[1], 16).toString(16).toUpperCase();
    while (h.length < 4) h = "0" + h;
    return "0x" + h;
  }
  function exportNames() {
    var out = ["# rom2altsound names", "# rom: " + (data.rom || "")];
    if (data.sound_rom_id) out.push("# sound_rom_id: " + data.sound_rom_id);
    out.push("# rom2altsound: " + data.version, "ID,NAME");
    var n = 0;
    sounds.forEach(function (s) {
      var name = nameOf(s);
      // A name cleared here is written empty, so that it clears the pack's too.
      if (name || edited(s)) { out.push(csvField(normId(s.id)) + "," + csvField(name)); n++; }
    });
    var url = URL.createObjectURL(new Blob([out.join("\r\n") + "\r\n"], { type: "text/csv" }));
    var a = el("a");
    a.href = url;
    a.download = "names.csv";
    a.hidden = true;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    showEdits("names.csv: " + n + " name" + (n === 1 ? "" : "s") + ".");
  }

  // RFC 4180 records; a record that starts with # is a comment up to the end of its line.
  function parseCsv(text) {
    var recs = [], i = 0, L = text.length;
    text = text.replace(/^\uFEFF/, "");
    L = text.length;
    while (i < L) {
      if (text.charAt(i) === "#") {
        var e = text.indexOf("\n", i);
        if (e < 0) e = L;
        recs.push({ comment: text.slice(i, e).replace(/\r$/, "") });
        i = e + 1;
        continue;
      }
      var rec = [], f = "", q = false;
      for (;;) {
        if (i >= L) { if (q) throw new Error("a quoted field is not closed"); rec.push(f); break; }
        var ch = text.charAt(i++);
        if (q) {
          if (ch === "\"") { if (text.charAt(i) === "\"") { f += "\""; i++; } else q = false; }
          else f += ch;
        } else if (ch === "\"" && f === "") q = true;
        else if (ch === ",") { rec.push(f); f = ""; }
        else if (ch === "\r" && text.charAt(i) === "\n") { /* the \n ends it */ }
        else if (ch === "\n") { rec.push(f); break; }
        else f += ch;
      }
      recs.push({ fields: rec });
    }
    return recs;
  }
  function importNames(text) {
    var recs = parseCsv(text), meta = {}, cols = null, got = [];
    recs.forEach(function (r) {
      if (r.comment !== undefined) {
        var m = /^#\s*([a-z_ ]+?)\s*:\s*(.*)$/i.exec(r.comment);
        if (m) meta[m[1].toLowerCase()] = m[2].trim();
        return;
      }
      var f = r.fields;
      if (f.every(function (x) { return !x.trim(); })) return;
      if (!cols) {
        var up = f.map(function (x) { return x.trim().toUpperCase(); });
        if (up.indexOf("ID") < 0 || up.indexOf("NAME") < 0) throw new Error("no ID,NAME header");
        cols = { id: up.indexOf("ID"), name: up.indexOf("NAME") };
        return;
      }
      got.push({ id: normId(f[cols.id] || ""), name: cleanName(f[cols.name] || "") });
    });
    if (!cols) throw new Error("no ID,NAME header");
    var theirs = (meta.sound_rom_id || "").toLowerCase(), ours = (data.sound_rom_id || "").toLowerCase();
    if (theirs && ours && theirs !== ours &&
        !confirm("This names.csv is for another sound ROM (" + (meta.rom || "?") + ", " + theirs +
          "), not " + data.rom + "'s (" + ours + "). Names belong to a sound ROM. Import anyway?")) {
      return "Not imported.";
    }
    var byId = {}, unknown = [], n = 0;
    sounds.forEach(function (s) { byId[normId(s.id)] = s; });
    got.forEach(function (g) {
      var s = byId[g.id];
      if (!s) { unknown.push(g.id); return; }
      if (g.name === (s.name || "")) delete edits[s.id];
      else edits[s.id] = g.name;
      n++;
    });
    saveEdits();
    sounds.forEach(function (s) { hay(s); renderName(s); });
    apply();
    return "Imported " + n + " name" + (n === 1 ? "" : "s") +
      (unknown.length ? " (" + unknown.length + " id" + (unknown.length > 1 ? "s" : "") + " not in this pack: " +
        unknown.slice(0, 8).join(" ") + (unknown.length > 8 ? " ..." : "") + ")" : "") + ".";
  }
  file.addEventListener("change", function () {
    var f = file.files && file.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var msg;
      try { msg = importNames(String(rd.result)); } catch (e) { msg = f.name + ": " + e.message + "."; }
      file.value = "";
      showEdits(msg);
    };
    rd.onerror = function () { file.value = ""; showEdits(f.name + ": cannot read it."); };
    rd.readAsText(f);
  });
  function clearEdits() {
    var n = Object.keys(edits).length;
    if (!n || !confirm("Forget the " + n + " name" + (n > 1 ? "s" : "") + " typed on this page? Export them first to keep them.")) return;
    edits = {};
    saveEdits();
    sounds.forEach(function (s) { hay(s); renderName(s); });
    apply();
    showEdits("Edits cleared.");
  }

  // One shared player. A loop body plays looped; the button of what plays pauses it.
  var audio = $("audio"), playing = null;
  function play(s, k) {
    var f = s.files[k], src = srcOf(f);
    if (playing && playing.s === s && playing.k === k) {
      if (audio.paused) audio.play(); else audio.pause();
      return;
    }
    mark(false);
    playing = { s: s, k: k };
    audio.loop = f.label === "loop";
    audio.src = src;
    audio.play().catch(function () {});
    nowLabel();
    mark(true);
  }
  function nowLabel() {
    if (!playing) return;
    var s = playing.s, f = s.files[playing.k], b = side === "B", n = nameOf(s);
    $("now").textContent = s.id + (n ? " " + n : "") + " (" + f.label + (audio.loop ? ", looped" : "") +
      (b ? ", from " + cmp : "") + ")";
    $("now").title = (b ? cmp : "") + f.path;
  }
  function mark(on) {
    if (!playing) return;
    var r = rows[playing.s.i];
    r.classList.toggle("playing", on);
    var b = r.querySelectorAll(".btns button")[playing.k];
    if (b) b.setAttribute("aria-pressed", on && !audio.paused ? "true" : "false");
    if (playing.s.ab) playing.s.ab.setAttribute("aria-pressed", on && side === "B" ? "true" : "false");
  }

  // A/B: the same file names in another folder (goodtwist's idea: copy the pack folder,
  // swap sounds in the copy, compare). Plain <audio> src switching, no fetch (file://).
  var KEY = "rom2altsound.compare." + (data.rom || ""), cmp = "", side = "A", missingB = {};
  // The compare folder may be relative to this page (../copy/) or absolute: a Windows drive
  // path (C:/...), a UNC share (//server/share/...) or a Unix path (/...), which need a
  // file: URL (an encoded "C:" would read as a relative name).
  function srcOf(f) {
    if (side !== "B") return href(f.path);
    var p = cmp + f.path, d = /^([A-Za-z]):\//.exec(p);
    if (d) return "file:///" + d[1] + ":/" + href(p.slice(3));
    if (p.charAt(0) === "/") return "file:" + (p.charAt(1) === "/" ? "" : "//") + href(p);
    return href(p);
  }
  function setCompare(v, keep) {
    v = String(v || "").trim().replace(/\\/g, "/");
    if (v && v.charAt(v.length - 1) !== "/") v += "/";
    if (v !== cmp) missingB = {};
    cmp = v;
    if (keep) save(KEY, cmp);
    sounds.forEach(function (s) { if (s.ab) s.ab.hidden = !cmp; });
    if (!cmp && side === "B") flip(true);
    showSide();
  }
  // Switches the player to the other side, at the same position and play state.
  function flip(force) {
    if (!cmp && !force) return;
    mark(false);
    side = side === "A" ? "B" : "A";
    if (playing) {
      var f = playing.s.files[playing.k], t = audio.currentTime || 0, was = !audio.paused;
      var once = function () {
        audio.removeEventListener("loadedmetadata", once);
        try { audio.currentTime = isFinite(audio.duration) ? Math.min(t, audio.duration) : t; } catch (e) { /* not seekable */ }
      };
      audio.addEventListener("loadedmetadata", once);
      audio.src = srcOf(f);
      if (was) audio.play().catch(function () {});
      nowLabel();
    }
    mark(true);
    showSide();
  }
  // A/B of a row: flips the side when the row is playing, else plays it on the current side
  // (the next press flips).
  function abClick(s) {
    if (playing && playing.s === s) { flip(); return; }
    var k = 0;
    s.files.forEach(function (f, i) { if (f.pack) k = i; });
    play(s, k);
    showSide();
  }
  function showSide() {
    var e = $("side"), miss = side === "B" && playing && missingB[playing.s.files[playing.k].path];
    e.hidden = !cmp;
    e.textContent = miss ? "B: missing" : side;
    e.className = miss ? "miss" : side === "B" ? "b" : "";
    e.title = side === "B" ? "B: " + cmp : "A: this folder";
  }
  audio.addEventListener("error", function () {
    if (side !== "B" || !playing) return;
    var s = playing.s, f = s.files[playing.k];
    if (!missingB[f.path]) {
      missingB[f.path] = true;
      if (s.info && !s.missTag) s.missTag = tag(s.info, "missing in B", true);
      if (s.missTag) s.missTag.title = Object.keys(missingB).filter(function (p) {
        return s.files.some(function (g) { return g.path === p; });
      }).map(function (p) { return cmp + p; }).join(" ");
    }
    showSide();
  });
  $("cmp").value = load(KEY);
  $("cmp").addEventListener("change", function () { setCompare($("cmp").value, true); });
  $("cmp").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); setCompare($("cmp").value, true); }
  });
  setCompare($("cmp").value, false);
  audio.addEventListener("play", function () { mark(true); });
  audio.addEventListener("pause", function () { mark(true); });
  audio.addEventListener("ended", function () { mark(true); });

  showEdits();
  apply();

  // The batch's root page: one line per ROM folder.
  function batchIndex() {
    var head = $("head");
    head.appendChild(el("h1", null, "rom2altsound packs"));
    head.appendChild(el("p", "meta", data.roms.length + " ROMs · rom2altsound " + data.version));
    var t = el("table"), tr = el("tr");
    ["ROM", "Boards", "Files", "Loops", "LUFS", "Factory offset"].forEach(function (h, i) {
      tr.appendChild(el("th", i > 1 ? "n" : null, h));
    });
    t.appendChild(tr);
    data.roms.forEach(function (r) {
      var tr = el("tr"), td = el("td"), a = el("a", "mono", r.rom || r.dir);
      a.href = href(r.page);
      td.appendChild(a);
      tr.appendChild(td);
      tr.appendChild(el("td", null, (r.boards || []).join(", ")));
      tr.appendChild(el("td", "n", r.written));
      tr.appendChild(el("td", "n", r.loops));
      tr.appendChild(el("td", "n", num(r.lufs, 1)));
      tr.appendChild(el("td", "n", typeof r.factory_offset_db === "number" ? db(r.factory_offset_db) : ""));
      t.appendChild(tr);
    });
    $("index").appendChild(t);
  }
})();
</script>
</body>
</html>
