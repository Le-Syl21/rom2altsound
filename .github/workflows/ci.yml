name: CI

# Nothing builds on a push: work lands directly on main, and the builds run at
# a tag (before anything is signed or published) or on demand. A manual run
# (workflow_dispatch) builds and tests every target but signs and publishes
# nothing: those jobs only run for a v* tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Test the binaries of a published release (e.g. v0.2.4) instead of building:
          only the verify jobs run
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # The tag must name the crate version exactly, pre-release included
      # (v0.1.0-beta.1 <-> 0.1.0-beta.1).
      - name: Check that the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo pkgid -p rom2altsound)
          crate="${crate##*[@#]}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $crate: update Cargo.toml, then re-tag"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME <-> Cargo.toml $crate: OK"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      # The synthetic test ROM set (tests/fixtures/s67s) is generated: the committed
      # files must be what its script makes.
      - name: Check the synthetic test ROM set
        run: python3 tests/fixtures/s67s/make_testrom.py --check

      # Both programs: the command line and the window (gui/).
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
          # The oldest macOS each binary runs on: 11.0 Big Sur is the first macOS for
          # Apple Silicon, 10.15 Catalina the Intel floor.
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            macos_min: '11.0'
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            macos_min: '10.15'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    env:
      # Read by rustc, the cc crate and build.rs (which hands it to PinMAME's CMake
      # build): every object of the binary targets the same oldest macOS. Empty, and
      # ignored, on the other systems.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          # Without this line, `--target` would fail on the macOS x86_64
          # cross-build (the macos-latest runner is arm64).
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: ${{ matrix.target }}

      # PinMAME (vendor/pinmame) is compiled by build.rs through CMake.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # The window program (gui/): the same library, already built above.
      - name: Build the window program
        run: cargo build --release --target ${{ matrix.target }} -p rom2altsound-gui

      # Same --target as the build, so that PinMAME is not compiled a second
      # time into target/release. The x86_64 macOS binary is cross-built on an
      # arm64 runner: not run here.
      - name: Run tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }} --workspace

      - name: Smoke test (--version)
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/rom2altsound --version

      # With arguments the window program is the command line (its extraction processes
      # are itself). Not on Windows: a windows-subsystem program has no console output.
      - name: Smoke test, window program (--version)
        if: matrix.target != 'x86_64-apple-darwin' && runner.os != 'Windows'
        run: target/${{ matrix.target }}/release/rom2altsound-gui --version

      # --- Packaging (unsigned; signing happens in jobs of their own, behind
      # the `signing` environment). ---
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir pkg
          cp target/${{ matrix.target }}/release/rom2altsound README.md LICENSE pkg/
          tar czf rom2altsound-${{ matrix.label }}.tar.gz -C pkg rom2altsound README.md LICENSE

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/rom2altsound.exe, README.md, LICENSE -DestinationPath rom2altsound-${{ matrix.label }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rom2altsound-${{ matrix.label }}
          path: rom2altsound-${{ matrix.label }}.*

      # The window program goes in archives of its own, so that the command line
      # download stays small: rom2altsound-gui-<platform>.
      - name: Package the window program (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir pkg-gui
          cp target/${{ matrix.target }}/release/rom2altsound-gui README.md LICENSE pkg-gui/
          tar czf rom2altsound-gui-${{ matrix.label }}.tar.gz -C pkg-gui rom2altsound-gui README.md LICENSE

      # macOS: an application bundle, rom2altsound.app (the executable inside it is
      # rom2altsound-gui, which also runs the extraction processes).
      - name: Package the window program (macOS)
        if: runner.os == 'macOS'
        run: |
          app=pkg-gui/rom2altsound.app
          mkdir -p "$app/Contents/MacOS"
          cp target/${{ matrix.target }}/release/rom2altsound-gui "$app/Contents/MacOS/"
          version=$(cargo pkgid -p rom2altsound-gui)
          version="${version##*[@#]}"
          sed -e "s/@VERSION@/$version/g" -e "s/@MACOS_MIN@/$MACOSX_DEPLOYMENT_TARGET/g" \
            gui/macos/Info.plist > "$app/Contents/Info.plist"
          grep -A1 LSMinimumSystemVersion "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          cp README.md LICENSE pkg-gui/
          ditto -c -k pkg-gui rom2altsound-gui-${{ matrix.label }}.zip

      - name: Package the window program (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/rom2altsound-gui.exe, README.md, LICENSE -DestinationPath rom2altsound-gui-${{ matrix.label }}.zip

      - name: Upload the window program
        uses: actions/upload-artifact@v7
        with:
          name: rom2altsound-gui-${{ matrix.label }}
          path: rom2altsound-gui-${{ matrix.label }}.*

  # Apple signing + notarization. Behind `signing`: the Apple secrets are
  # environment secrets, and a Developer ID signature commits the owner's
  # identity, so it never goes out without explicit approval.
  sign-apple:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    environment: signing
    steps:
      - name: Download the macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rom2altsound-macos-*
          path: dl

      - name: Download the macOS window program artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rom2altsound-gui-macos-*
          path: dl

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign & notarize the macOS binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Submit and poll with timeout + retry (3 attempts, 5/15/45 min backoff)
          notarize_once() {
            local zip="$1" label="$2" timeout="$3"

            local output
            output=$(xcrun notarytool submit "$zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --verbose 2>&1)
            echo "$output"
            local sub_id
            sub_id=$(echo "$output" | awk '/id:/{print $2; exit}')
            [ -n "$sub_id" ] || { echo "$label: failed to get submission ID"; return 1; }
            echo "$label: submitted (id: $sub_id)"

            local deadline=$((SECONDS + timeout))
            while [ $SECONDS -lt $deadline ]; do
              sleep 30
              local info
              info=$(xcrun notarytool info "$sub_id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_ID_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" 2>&1) || { echo "$label: network error, retrying poll..."; continue; }

              local status
              status=$(echo "$info" | awk '/status:/{print $2; exit}')
              echo "$label: $status"

              case "$status" in
                Accepted) return 0 ;;
                Invalid|Rejected)
                  xcrun notarytool log "$sub_id" \
                    --apple-id "$APPLE_ID" \
                    --password "$APPLE_ID_PASSWORD" \
                    --team-id "$APPLE_TEAM_ID" 2>&1 || true
                  return 1 ;;
              esac
            done
            echo "$label: timed out after $((timeout / 60)) minutes"
            return 2  # timeout, retryable
          }

          notarize() {
            local zip="$1" label="$2"
            local backoffs=(300 900 2700)  # 5 / 15 / 45 minutes
            for i in 0 1 2; do
              echo "$label: attempt $((i + 1))/3"
              notarize_once "$zip" "$label" "${backoffs[$i]}" && return 0
              local rc=$?
              [ $rc -eq 2 ] || return $rc  # only retry on timeout (rc=2)
              [ $i -lt 2 ] && echo "$label: retrying after timeout..."
            done
            return 1
          }

          SIGN_ID="Developer ID Application: Sylvain Gargasson ($APPLE_TEAM_ID)"
          artifacts=(rom2altsound-macos-arm64 rom2altsound-macos-x86_64)
          gui_artifacts=(rom2altsound-gui-macos-arm64 rom2altsound-gui-macos-x86_64)

          # 1) Sign and verify, then zip for notarization.
          for art in "${artifacts[@]}"; do
            echo "::group::sign $art"
            work="$RUNNER_TEMP/$art"
            mkdir -p "$work"
            tar xzf "dl/$art/$art.tar.gz" -C "$work"
            codesign --force --options runtime \
              --sign "$SIGN_ID" \
              --timestamp "$work/rom2altsound"
            codesign --verify --strict --verbose=2 "$work/rom2altsound"
            ditto -c -k --keepParent "$work/rom2altsound" "$RUNNER_TEMP/$art.zip"
            echo "::endgroup::"
          done
          # The window program: the application bundle is signed as a whole.
          for art in "${gui_artifacts[@]}"; do
            echo "::group::sign $art"
            work="$RUNNER_TEMP/$art"
            mkdir -p "$work"
            ditto -x -k "dl/$art/$art.zip" "$work"
            codesign --force --options runtime \
              --sign "$SIGN_ID" \
              --timestamp "$work/rom2altsound.app"
            codesign --verify --deep --strict --verbose=2 "$work/rom2altsound.app"
            ditto -c -k --keepParent "$work/rom2altsound.app" "$RUNNER_TEMP/$art.zip"
            echo "::endgroup::"
          done

          # 2) Notarize in parallel, then collect the exit codes one by one.
          all=("${artifacts[@]}" "${gui_artifacts[@]}")
          pids=()
          for art in "${all[@]}"; do
            notarize "$RUNNER_TEMP/$art.zip" "$art" &
            pids+=("$!")
          done
          failed=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || { echo "::error::${all[$i]}: notarization failed"; failed=1; }
          done
          [ $failed -eq 0 ] || exit 1

          # 3) Repackage the signed binaries under their original names (the bundles
          # with their notarization ticket stapled, for a first launch offline).
          for art in "${artifacts[@]}"; do
            tar czf "$art.tar.gz" -C "$RUNNER_TEMP/$art" rom2altsound README.md LICENSE
          done
          for art in "${gui_artifacts[@]}"; do
            xcrun stapler staple "$RUNNER_TEMP/$art/rom2altsound.app"
            ditto -c -k "$RUNNER_TEMP/$art" "$art.zip"
          done

      - name: Re-upload the signed arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: rom2altsound-macos-arm64
          path: rom2altsound-macos-arm64.tar.gz
          overwrite: true

      - name: Re-upload the signed x86_64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: rom2altsound-macos-x86_64
          path: rom2altsound-macos-x86_64.tar.gz
          overwrite: true

      - name: Re-upload the signed arm64 window program
        uses: actions/upload-artifact@v7
        with:
          name: rom2altsound-gui-macos-arm64
          path: rom2altsound-gui-macos-arm64.zip
          overwrite: true

      - name: Re-upload the signed x86_64 window program
        uses: actions/upload-artifact@v7
        with:
          name: rom2altsound-gui-macos-x86_64
          path: rom2altsound-gui-macos-x86_64.zip
          overwrite: true

  # Authenticode-sign the Windows binary with ssign: the Linux runner signs it
  # via Certum (no Windows, no vendor stack). Gated by the `signing`
  # environment (owner approval); the release below needs it.
  sign-windows:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - name: Install ssign (prebuilt binary from the latest release)
        run: |
          curl -fsSL https://github.com/Le-Syl21/ssign/releases/latest/download/ssign-linux-x86_64.tar.gz | tar xz
          sudo install -m755 ssign /usr/local/bin/ssign

      - name: Download the Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: rom2altsound-windows-x86_64
          path: dl

      - name: Download the Windows window program artifact
        uses: actions/download-artifact@v8
        with:
          name: rom2altsound-gui-windows-x86_64
          path: dl-gui

      - name: Sign with ssign (via Certum)
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          (cd dl && unzip -o rom2altsound-windows-x86_64.zip)
          (cd dl-gui && unzip -o rom2altsound-gui-windows-x86_64.zip)
          # Both programs in one session.
          ssign --verbose \
            -n "rom2altsound" -u "https://github.com/${{ github.repository }}" \
            dl/rom2altsound.exe dl-gui/rom2altsound-gui.exe
          sudo apt-get update -qq && sudo apt-get install -y osslsigncode
          # Check the facts, not the presence of a sentence: "Calculated message
          # digest" also appears when the digest does NOT match, and says nothing
          # about timestamping.
          for exe in dl/rom2altsound.exe dl-gui/rom2altsound-gui.exe; do
            out=$(osslsigncode verify "$exe" 2>&1) || true
            echo "$out"
            if echo "$out" | grep -q "MISMATCH"; then
              echo "::error::$exe: invalid Authenticode digest (Windows would see it as tampered with)"
              exit 1
            fi
            if echo "$out" | grep -q "Timestamp is not available"; then
              echo "::error::$exe: signature is not timestamped (invalid as soon as the certificate expires)"
              exit 1
            fi
            if ! echo "$out" | grep -q "Signature verification: ok"; then
              echo "::error::$exe: signature verification failed"
              exit 1
            fi
          done
          (cd dl && rm -f rom2altsound-windows-x86_64.zip \
            && zip -j rom2altsound-windows-x86_64.zip rom2altsound.exe README.md LICENSE)
          (cd dl-gui && rm -f rom2altsound-gui-windows-x86_64.zip \
            && zip -j rom2altsound-gui-windows-x86_64.zip rom2altsound-gui.exe README.md LICENSE)

      - name: Re-upload the signed artifact
        uses: actions/upload-artifact@v7
        with:
          name: rom2altsound-windows-x86_64
          path: dl/rom2altsound-windows-x86_64.zip
          overwrite: true

      - name: Re-upload the signed window program
        uses: actions/upload-artifact@v7
        with:
          name: rom2altsound-gui-windows-x86_64
          path: dl-gui/rom2altsound-gui-windows-x86_64.zip
          overwrite: true

  # Every binary, as a user downloads it, on its own system: unpack the archive, then
  # extract the synthetic test ROM set (tests/fixtures/s67s: a sound program written for
  # these tests, no original ROM code) with the command line and with the window program
  # (given arguments, it is the command line), and check the pack (tests/check_pack.py).
  # At a tag it runs after signing, on the signed binaries; on a manual run, on the
  # unsigned ones, or on a published release's (input release_tag).
  verify:
    needs: [build, sign-apple, sign-windows]
    if: >-
      !cancelled()
      && (needs.build.result == 'success'
          || (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
      && (needs.sign-apple.result == 'success' || needs.sign-apple.result == 'skipped')
      && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest
            label: macos-arm64
            macos_min: '11.0'
          # A real Intel Mac: the x86_64 binary is cross-built on arm64, where it would
          # only run under Rosetta.
          - os: macos-15-intel
            label: macos-x86_64
            macos_min: '10.15'
    runs-on: ${{ matrix.os }}
    name: verify ${{ matrix.label }}
    defaults:
      run:
        shell: bash
    env:
      LABEL: ${{ matrix.label }}
      MACOS_MIN: ${{ matrix.macos_min }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
    steps:
      # The test files only (no submodule, no build).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tests

      - name: Download this run's archives
        if: env.RELEASE_TAG == ''
        uses: actions/download-artifact@v8
        with:
          pattern: rom2altsound*-${{ matrix.label }}
          path: dl
          merge-multiple: true

      # Release assets come over HTTPS without a quarantine attribute, like curl; the
      # macOS steps below add it the way a browser does.
      - name: Download the release's archives
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" -R "${{ github.repository }}" -D dl \
            -p "rom2altsound-$LABEL.*" -p "rom2altsound-gui-$LABEL.*"

      - name: Unpack
        run: |
          ls -l dl
          mkdir cli gui
          case "$LABEL" in
            windows-*)
              pwsh -c "Expand-Archive dl/rom2altsound-$LABEL.zip cli"
              if [ -f "dl/rom2altsound-gui-$LABEL.zip" ]; then
                pwsh -c "Expand-Archive dl/rom2altsound-gui-$LABEL.zip gui"
              fi
              echo "CLI=cli/rom2altsound.exe" >> "$GITHUB_ENV"
              echo "GUI=gui/rom2altsound-gui.exe" >> "$GITHUB_ENV"
              echo "PYTHON=python" >> "$GITHUB_ENV" ;;
            macos-*)
              tar xzf "dl/rom2altsound-$LABEL.tar.gz" -C cli
              if [ -f "dl/rom2altsound-gui-$LABEL.zip" ]; then
                ditto -x -k "dl/rom2altsound-gui-$LABEL.zip" gui
              fi
              echo "CLI=cli/rom2altsound" >> "$GITHUB_ENV"
              echo "GUI=gui/rom2altsound.app/Contents/MacOS/rom2altsound-gui" >> "$GITHUB_ENV"
              echo "PYTHON=python3" >> "$GITHUB_ENV" ;;
            *)
              tar xzf "dl/rom2altsound-$LABEL.tar.gz" -C cli
              if [ -f "dl/rom2altsound-gui-$LABEL.tar.gz" ]; then
                tar xzf "dl/rom2altsound-gui-$LABEL.tar.gz" -C gui
              fi
              echo "CLI=cli/rom2altsound" >> "$GITHUB_ENV"
              echo "GUI=gui/rom2altsound-gui" >> "$GITHUB_ENV"
              echo "PYTHON=python3" >> "$GITHUB_ENV" ;;
          esac

      # What the binary is: architecture, the libraries it links, the oldest macOS it
      # accepts (LC_BUILD_VERSION minos), its signature and Gatekeeper's verdict.
      - name: Describe the binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          sw_vers
          uname -m
          spctl --status || true
          for bin in "$CLI" "$GUI"; do
            [ -e "$bin" ] || continue
            echo "::group::$bin"
            file "$bin"
            otool -L "$bin"
            otool -l "$bin" | grep -A4 LC_BUILD_VERSION || true
            codesign -dvv "$bin" 2>&1 || true
            codesign --verify --strict --verbose=2 "$bin" 2>&1 || true
            echo "::endgroup::"
          done
          if [ -d gui/rom2altsound.app ]; then
            spctl -a -vv -t exec gui/rom2altsound.app 2>&1 || true
            xcrun stapler validate gui/rom2altsound.app 2>&1 || true
          fi
          spctl -a -vv -t exec "$CLI" 2>&1 || true

      # The binaries must load on the oldest macOS announced (no runner has it): their
      # minos must not exceed it, nor the bundle's LSMinimumSystemVersion. Frameworks
      # and libraries are listed with how they are loaded (a weak load may be absent).
      - name: Oldest macOS accepted (macOS)
        if: runner.os == 'macOS'
        run: |
          fail=0
          for bin in "$CLI" "$GUI"; do
            [ -e "$bin" ] || continue
            echo "::group::$bin"
            vtool -show-build "$bin"
            otool -l "$bin" | awk '/cmd LC_LOAD_(WEAK_)?DYLIB/{c=$2} $1=="name" && c{print c, $2; c=""}'
            # libc++ is the system's: its imports must exist on the oldest macOS. The C++
            # code is compiled with -Werror=unguarded-availability; this catches what got
            # through anyway (symbols libc++ only exports from macOS 11 to 13.4).
            imports=$(nm -m -u "$bin" | grep 'from libc++' || true)
            echo "$(printf '%s\n' "$imports" | grep -c . || true) libc++ imports, $(nm -m -u "$bin" | grep -c 'weak' || true) weak imports"
            newer=$(printf '%s\n' "$imports" | grep -E '__libcpp_verbose_abort|to_charsEPcS0_[def]|__libcpp_atomic_wait|__cxx_atomic_notify|__cxx_atomic_wait|__hash_memory|__libcpp_tzdb|3pmr' || true)
            echo "::endgroup::"
            if [ -n "$newer" ]; then
              echo "::error::$bin imports libc++ symbols newer than macOS $MACOS_MIN:"
              printf '%s\n' "$newer"; fail=1
            fi
            minos=$(otool -l "$bin" | awk '/LC_BUILD_VERSION/{b=1} b && $1=="minos"{print $2; exit}')
            echo "$bin: minos $minos (announced: $MACOS_MIN)"
            if [ -z "$minos" ]; then
              echo "::error::$bin: no LC_BUILD_VERSION minos"; fail=1
            elif [ "$(printf '%s\n%s\n' "$minos" "$MACOS_MIN" | sort -V | tail -1)" != "$MACOS_MIN" ]; then
              echo "::error::$bin: minos $minos is above $MACOS_MIN"; fail=1
            fi
          done
          plist=gui/rom2altsound.app/Contents/Info.plist
          if [ -f "$plist" ]; then
            lsmin=$(plutil -extract LSMinimumSystemVersion raw "$plist")
            echo "LSMinimumSystemVersion: $lsmin"
            if [ "$lsmin" != "$MACOS_MIN" ]; then
              echo "::error::LSMinimumSystemVersion $lsmin, expected $MACOS_MIN"; fail=1
            fi
          fi
          exit $fail

      - name: Extract the test ROM, command line
        run: |
          "$CLI" --version
          "$PYTHON" tests/check_pack.py --bin "$CLI" --work work-cli

      - name: Extract the test ROM, window program as the command line
        run: |
          if [ ! -e "$GUI" ]; then
            echo "::warning::no window program in this release"
            exit 0
          fi
          "$PYTHON" tests/check_pack.py --bin "$GUI" --zip-arg --work work-gui

      # What a browser download does on macOS: the archive, and everything unpacked from
      # it, carries com.apple.quarantine, and Gatekeeper assesses the program at its first
      # launch. A bare signed binary cannot hold a stapled ticket: Gatekeeper must reach
      # Apple's servers to find its notarization.
      # Caveat, seen on the runners (macOS 15 Intel, macOS 26 arm64): a program started by
      # the runner is not stopped by Gatekeeper, quarantined or not; even unsigned
      # binaries that spctl rejects run. So the runs below prove the binaries work
      # quarantined, not that a user's Terminal or Finder lets them start: for that, the
      # signed binaries must also pass Apple's own checks, Gatekeeper's verdict on the
      # application and the online notarization check of the bare binary.
      - name: Quarantined, as downloaded by a browser (macOS)
        if: runner.os == 'macOS'
        run: |
          signed=no
          if [ -n "$RELEASE_TAG" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then signed=yes; fi
          # Gatekeeper on, as on a user's Mac (the runner image may have it off).
          sudo spctl --master-enable 2>&1 || sudo spctl --global-enable 2>&1 || true
          spctl --status || true
          rm -rf q && mkdir q
          cp -R cli q/cli
          [ -d gui/rom2altsound.app ] && cp -R gui/rom2altsound.app q/
          q="0081;$(printf %x "$(date +%s)");Safari;"
          xattr -w com.apple.quarantine "$q" q/cli/rom2altsound
          [ -d q/rom2altsound.app ] && xattr -r -w com.apple.quarantine "$q" q/rom2altsound.app
          xattr -l q/cli/rom2altsound
          failed=0
          echo "::group::quarantined command line"
          if q/cli/rom2altsound --version; then
            python3 tests/check_pack.py --bin q/cli/rom2altsound --work work-q-cli || failed=1
          else
            echo "quarantined command line refused, exit status $?"
            failed=1
          fi
          echo "::endgroup::"
          if [ -d q/rom2altsound.app ]; then
            echo "::group::quarantined application"
            spctl -a -vv -t exec q/rom2altsound.app 2>&1 || true
            python3 tests/check_pack.py --bin q/rom2altsound.app/Contents/MacOS/rom2altsound-gui \
              --zip-arg --work work-q-gui || failed=1
            echo "::endgroup::"
          fi
          # What Gatekeeper said (the last minutes of its log).
          log show --last 10m --style compact \
            --predicate 'process == "syspolicyd" OR subsystem == "com.apple.syspolicy"' 2>/dev/null \
            | grep -i -E 'rom2altsound|notar|quarantine|reject|allow' | tail -n 60 || true
          if [ $failed -ne 0 ]; then
            echo "::error::the quarantined binaries did not run"
            exit 1
          fi
          if [ "$signed" = yes ]; then
            # The bare binary: its notarization, asked to Apple's servers.
            codesign --verify --strict --check-notarization -R=notarized --verbose=2 \
              q/cli/rom2altsound 2>&1 || { echo "::error::the command line is not notarized"; exit 1; }
            if [ -d q/rom2altsound.app ]; then
              verdict=$(spctl -a -vv -t exec q/rom2altsound.app 2>&1 || true)
              echo "$verdict"
              if ! echo "$verdict" | grep -q "accepted" || ! echo "$verdict" | grep -q "Notarized Developer ID"; then
                echo "::error::Gatekeeper does not accept the quarantined application"
                exit 1
              fi
              xcrun stapler validate q/rom2altsound.app || { echo "::error::no stapled ticket"; exit 1; }
            fi
          else
            echo "unsigned binaries (signing only happens at a tag): Gatekeeper checks skipped"
          fi

      # Windows' equivalent: the Mark of the Web (Zone.Identifier, zone 3 = Internet) a
      # browser puts on a download.
      - name: Marked as downloaded from the Internet (Windows)
        if: runner.os == 'Windows'
        run: |
          rm -rf q && mkdir q && cp cli/rom2altsound.exe q/
          pwsh -c 'Set-Content -Path q/rom2altsound.exe -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"'
          pwsh -c 'Get-Content -Path q/rom2altsound.exe -Stream Zone.Identifier'
          python tests/check_pack.py --bin q/rom2altsound.exe --work work-q-cli

      - name: Keep the packs when a check fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-packs-${{ matrix.label }}
          path: work-*/out
          if-no-files-found: ignore

  release:
    needs: [build, sign-windows, sign-apple, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts

      # A tag with a '-' (v0.1.0-beta.1) is published as a pre-release.
      # The notes always go through --notes-file (never `--notes -`, which
      # publishes a body made of a single "-").
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<'EOF'
          Turn a pinball ROM's sound board into an AltSound pack.

          | system | command line | window (GUI) |
          |---|---|---|
          | Linux x86_64 | `rom2altsound-linux-x86_64.tar.gz` | `rom2altsound-gui-linux-x86_64.tar.gz` |
          | Linux aarch64 | `rom2altsound-linux-aarch64.tar.gz` | `rom2altsound-gui-linux-aarch64.tar.gz` |
          | Windows x86_64 (signed) | `rom2altsound-windows-x86_64.zip` | `rom2altsound-gui-windows-x86_64.zip` |
          | macOS Apple Silicon, 11 Big Sur or later (signed, notarized) | `rom2altsound-macos-arm64.tar.gz` | `rom2altsound-gui-macos-arm64.zip` |
          | macOS Intel, 10.15 Catalina or later (signed, notarized) | `rom2altsound-macos-x86_64.tar.gz` | `rom2altsound-gui-macos-x86_64.zip` |

          The window program is a separate download (the command line one stays small); it
          does everything the command line does.

          Usage, supported boards and limits: see the README.
          Help and feedback: https://discord.gg/T37DYHmt2j (channel #rom2altsound)
          EOF
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "rom2altsound ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes" \
            --generate-notes \
            $prerelease \
            "$RUNNER_TEMP"/artifacts/*/*
          body=$(gh release view "$GITHUB_REF_NAME" --json body --jq '.body')
          if [ ${#body} -lt 100 ]; then
            echo "::error::release body is only ${#body} characters"
            exit 1
          fi
