[package]
name = "rom2altsound"
version.workspace = true
edition = "2024"
description = "Turn a pinball ROM's sound board into an AltSound pack by driving PinMAME's sound board in-process"
license = "BSD-3-Clause"
repository = "https://github.com/Le-Syl21/rom2altsound"
homepage = "https://github.com/Le-Syl21/rom2altsound"
readme = "README.md"
keywords = ["pinball", "pinmame", "altsound", "vpinball", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]
publish = false

# Two programs of different weight: the command line (this package) pulls no GUI stack,
# while `rom2altsound-gui` (gui/) links eframe/egui. Both drive the same extraction
# engine, this package's library. A plain `cargo build` builds the command line only.
[workspace]
members = [".", "gui"]
default-members = ["."]

# One version for both programs (a release tag names it).
[workspace.package]
version = "0.2.4"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ebur128 = { version = "0.1.10", features = ["precision-true-peak"] }
miniz_oxide = "0.8"

[target.'cfg(unix)'.dependencies]
# kill(2) on a process group: a cancelled ROM's processes all stop at once.
libc = "0.2"

[build-dependencies]
cc = "1.4"
cmake = "0.1.54"
