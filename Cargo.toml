[package]
name = "rom2altsound"
version.workspace = true
edition = "2024"
description = "Turn a pinball ROM's sound board into an AltSound pack by driving PinMAME's sound board in-process"
license = "BSD-3-Clause"
repository = "https://github.com/Le-Syl21/rom2altsound"
readme = "README.md"
keywords = ["pinball", "pinmame", "altsound", "vpinball", "audio"]
categories = ["multimedia::audio", "emulators"]
# The library, PinMAME's sources it builds and the C shim (the programs, the tagger and the
# documentation stay in the repository).
include = [
    "src/**",
    "shim/**",
    "build.rs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "docs/vpx_playback.json",
    "docs/board-support.md",
    "vendor/pinmame/LICENSE",
    "vendor/pinmame/release/sounds.dat",
    "vendor/pinmame/src/**",
    "vendor/pinmame/cmake/*.cmake",
    "vendor/pinmame/cmake/libpinmame/**",
    "vendor/pinmame/ext/vgm/**",
    "vendor/pinmame/ext/ymfm/**",
    "vendor/pinmame/ext/zlib/**",
    # libsamplerate without high_qual_coeffs.h (9 MB): src_sinc_opt.c leaves it out
    "vendor/pinmame/ext/libsamplerate/COPYING",
    "vendor/pinmame/ext/libsamplerate/common.h",
    "vendor/pinmame/ext/libsamplerate/config.h",
    "vendor/pinmame/ext/libsamplerate/fastest_coeffs.h",
    "vendor/pinmame/ext/libsamplerate/float_cast.h",
    "vendor/pinmame/ext/libsamplerate/mid_qual_coeffs.h",
    "vendor/pinmame/ext/libsamplerate/samplerate.c",
    "vendor/pinmame/ext/libsamplerate/samplerate.h",
    "vendor/pinmame/ext/libsamplerate/src_linear.c",
    "vendor/pinmame/ext/libsamplerate/src_sinc.c",
    "vendor/pinmame/ext/libsamplerate/src_sinc_opt.c",
    "vendor/pinmame/ext/libsamplerate/src_zoh.c",
    "vendor/pinmame/ext/dmddevice/usbalphanumeric.h",
    "vendor/pinmame/ext/nlohmann/json.hpp",
    "vendor/pinmame/ext/sse2neon.h",
]

# This package is the library (the extraction engine, published). The programs are in the
# repository only: the command line (cli/, no GUI stack), the window (gui/, eframe/egui) and
# their audio tagger (ced/). A plain `cargo build` builds the command line.
[workspace]
members = [".", "cli", "gui", "ced"]
default-members = ["cli"]

# One version for the library and the programs (a release tag names it).
[workspace.package]
version = "0.7.0"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ebur128 = { version = "0.1.10", features = ["precision-true-peak"] }
miniz_oxide = "0.8"

[features]
# The listening page (index.html) written next to each pack, as the programs do.
page = []

[target.'cfg(unix)'.dependencies]
# kill(2) on a process group: a cancelled ROM's processes all stop at once.
libc = "0.2"

[build-dependencies]
cc = "1.4"
cmake = "0.1.54"
